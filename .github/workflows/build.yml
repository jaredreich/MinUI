name: Build and Release MinUI

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        # platform: [miyoomini, trimuismart, rg35xx, rg35xxplus, my355, tg5040, zero28, rgb30, m17, gkdpixel, my282, magicmini]
        platform: [rg35xxplus]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if should build this platform
        id: should_build
        run: |
          PLATFORMS_INPUT="${{ github.event.inputs.platforms || 'all' }}"
          if [ "$PLATFORMS_INPUT" = "all" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra PLATFORM_LIST <<< "$PLATFORMS_INPUT"
            BUILD_THIS=false
            for p in "${PLATFORM_LIST[@]}"; do
              p_trimmed=$(echo "$p" | xargs)
              if [ "$p_trimmed" = "${{ matrix.platform }}" ]; then
                BUILD_THIS=true
                break
              fi
            done
            echo "build=$BUILD_THIS" >> $GITHUB_OUTPUT
          fi

      - name: Build platform
        if: steps.should_build.outputs.build == 'true'
        run: |
          cd ${{ github.workspace }}
          make ${{ matrix.platform }}

      - name: Package release files
        if: steps.should_build.outputs.build == 'true'
        run: |
          cd ${{ github.workspace }}
          make package || true

      - name: Generate Release Tag
        id: tag
        if: steps.should_build.outputs.build == 'true'
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          echo "tag_name=build-$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Release tag will be: build-$TIMESTAMP"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: (steps.should_build.outputs.build == 'true') && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          files: releases/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}